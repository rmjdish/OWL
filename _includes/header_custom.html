<header class="site-header">
  <div class="site-header-inner">

    <!-- Search bar -->
    <div class="search">
      {{ search_input }}
    </div>

    <!-- Basket icon -->
    <div id="basketWrapper" style="position: relative; display: inline-block; margin-left: 20px;">
      <div id="basketTop" class="basket-top">
        🧺 <span id="basketCount">0</span>
      </div>
      <div id="basketDropdown"></div>
    </div>

  </div>
</header>

<style>
/* ⭐ Basket glow when non-empty */
#basketTop.basket-glow {
  box-shadow: 0 0 10px 4px rgba(128, 0, 255, 0.6);
  border-radius: 6px;
  transition: box-shadow 0.3s ease;
}

/* ⭐ Pulse when adding */
#basketTop.basket-glow-pulse {
  box-shadow: 0 0 14px 6px rgba(128, 0, 255, 0.8);
}

/* ⭐ Shake when removing */
#basketTop.shake {
  animation: shakeAnim 0.3s;
}

@keyframes shakeAnim {
  0% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

/* ⭐ Count pulse */
#basketCount.added {
  animation: pulseCount 0.4s ease;
}

@keyframes pulseCount {
  0% { transform: scale(1); }
  50% { transform: scale(1.35); }
  100% { transform: scale(1); }
}
</style>
