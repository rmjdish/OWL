<!-- ============================================================
     Custom Sidebar Override for Just-the-Docs
     Adds persistent Basket icon with live count
     ============================================================ -->

<nav class="side-bar" aria-label="Main navigation">

  <!-- Site Title -->
  <header class="site-title">
    <a href="{{ '/' | absolute_url }}">{{ site.title }}</a>
  </header>

  <!-- ⭐ Persistent Basket Icon (NOT part of nav list) -->
  <div class="sidebar-basket">
    <a href="/data_dict/docs/basket/">
      🧺 Basket <span id="sidebarBasketCount">0</span>
    </a>
  </div>

  <!-- ⭐ Standard Navigation List -->
  <ul class="nav-list">
    {% assign pages_list = site.html_pages | sort: 'nav_order' %}
    {% for node in pages_list %}
      {% if node.nav_exclude != true %}
        <li class="nav-list-item{% if page.url == node.url %} active{% endif %}">
          <a href="{{ node.url | absolute_url }}" class="nav-list-link">
            {{ node.title }}
          </a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>

</nav>

<!-- ⭐ Basket Count Script -->
<script>
  function loadBasket() {
    try {
      return JSON.parse(localStorage.getItem("nshd_variable_basket")) || [];
    } catch {
      return [];
    }
  }

  function updateSidebarBasketCount() {
    const el = document.getElementById("sidebarBasketCount");
    if (!el) return;
    el.textContent = loadBasket().length;
  }

  document.addEventListener("DOMContentLoaded", updateSidebarBasketCount);
</script>

<!-- ⭐ Sidebar Basket Styling -->
<style>
  .sidebar-basket {
    margin: 12px 0;
    padding: 8px 10px;
    background: #f3e5f5;
    border-radius: 6px;
    font-weight: bold;
  }

  .sidebar-basket a {
    color: #4b067a;
    text-decoration: none;
  }

  .sidebar-basket a:hover {
    text-decoration: underline;
  }
</style>
