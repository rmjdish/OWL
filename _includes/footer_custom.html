<!-- Global basket placeholder -->
<div id="basketTop" class="basket-top" style="display:none;">
  🧺 <span id="basketCount">0</span>
</div>

<script>
// ⭐ Move basket next to the main Just-the-Docs search bar
function waitForMainSearch() {
  const searchBox = document.querySelector(".search");  // the real JTD search bar
  const basket = document.getElementById("basketTop");

  if (searchBox && basket) {
    basket.style.display = "flex";
    searchBox.insertAdjacentElement("afterend", basket);

    if (typeof updateBasketCountUI === "function") {
      updateBasketCountUI();
    }

    basket.addEventListener("click", () => {
      window.location = "/OWL/docs/basket/";
    });

    return;
  }

  setTimeout(waitForMainSearch, 50);
}
