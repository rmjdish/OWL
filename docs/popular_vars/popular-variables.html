<h1>Popular Variables (Top 1000)</h1>

<div id="table-container">
  <p>Loading table…</p>
</div>

<style>
/* Pastel column colours */
th.year-col { background: #f3e8ff; }   /* pastel purple */
th.name-col { background: #e0f2fe; }   /* pastel blue */
th.pf-col   { background: #fef9c3; }   /* pastel yellow */
th.check-col { background: #f1f5f9; }  /* light grey */

/* Table styling */
#vars-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
}

#vars-table th, #vars-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #e5e7eb;
}

#vars-table th {
  cursor: pointer;
  font-weight: 600;
}

#vars-table tr:hover {
  background: #fafafa;
}

/* Pagination */
.pagination-controls {
  margin-top: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Basket pulse animation */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.basket-pulse {
  animation: pulse 0.3s ease;
}
</style>

<script>
console.log("Popular vars table script starting…");

fetch("popular_vars.json")
  .then(r => {
    console.log("Fetch status:", r.status);
    return r.json();
  })
  .then(json => {
    console.log("JSON loaded:", json);

    const rows = [];

    // If your JSON is { "2020": [ ... ], "2021": [ ... ] }
    Object.keys(json).forEach(year => {
      json[year].forEach(item => {
        rows.push({
          year: year,
          name: item.varName,
          pf: item.pf
        });
      });
    });

    const data = rows.slice(0, 1000);
    console.log("Flattened rows:", data.length);

    buildTable(data);
  })
  .catch(err => {
    console.error("Error loading JSON:", err);
    const container = document.getElementById("table-container");
    container.innerHTML = "<p>Failed to load data.</p>";
  });
</script>
