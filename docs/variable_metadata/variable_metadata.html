<link rel="stylesheet" href="/OWL/assets/css/variable_metadata.css">
<div class="page-variable-detail">
  <a href="/OWL/search-by-year" class="back-link">&larr; Back to search</a>

  <div id="loadingState" class="loading-screen">
    <div class="spinner"></div>
    <div>Loading variable…</div>
  </div>

  <div id="notFoundState" class="not-found" style="display:none;">
    <h1>Variable not found</h1>
    <p>No metadata could be found for <code id="notFoundVarName"></code>.</p>
  </div>

  <div id="variableContent" style="display:none;">
    <div class="var-header">
      <h1 id="varName"></h1>
      <p id="varLabel"></p>
    </div>

    <div id="summaryStrip" class="summary-strip"></div>

    <p class="section-title">Details</p>
    <table class="detail-table">
      <tbody id="detailTable"></tbody>
    </table>

    <div id="valueLabelsSection" style="display:none;">
      <p class="section-title">Value labels</p>
      <table class="value-labels-table">
        <tbody id="valueLabelsTable"></tbody>
      </table>
    </div>

    <div id="notesSection" style="display:none;">
      <p class="section-title">Notes</p>
      <div class="notes-box" id="notesText"></div>
    </div>
  </div>

  <script src="/OWL/assets/js/variable_metadata.js"></script>
</div>
